<!doctype html>
<html lang="en">
<head>
<script src="/website-analytics.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're challenged! · Flappy Tappy</title>
<meta name="description" content="30-second one-tap duels. Beat my score in Flappy Tappy.">
<meta property="og:title" content="You've been challenged in Flappy Tappy">
<meta property="og:description" content="Can you beat my score? 30 seconds, one tap.">
<!-- November 21: the link preview Messenger and Facebook show (a static page cannot change it per challenge). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flappy Tappy">
<meta property="og:url" content="https://chiragmirani.github.io/ft/c/">
<meta property="og:image" content="https://chiragmirani.github.io/ft/c/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Flappy Tappy: beat my score">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chiragmirani.github.io/ft/c/og.png">
<meta name="apple-itunes-app" content="app-id=1203310957">
<meta name="google-play-app" content="app-id=com.flappytappy">
<style>
  :root { --sky1:#ffffff; --sky2:#efe9ff; --ink:#1f1b3a; --muted:#6b6690; --magenta:#ff2d8a; --violet:#5a32d6; --cyan:#22c3e6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: ui-rounded, -apple-system, "SF Pro Rounded", system-ui, sans-serif;
         background: linear-gradient(180deg, var(--sky1), var(--sky2)); color: var(--ink);
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:28px; padding:28px 24px; text-align:center;
          box-shadow: 0 10px 30px rgba(90,50,214,.18); border:1.5px solid #ece6ff; }
  .tag { display:inline-block; background: var(--violet); color:#fff; font-weight:800; letter-spacing:3px; font-size:12px;
         padding:8px 14px; border-radius:999px; }
  h1 { font-size:40px; margin:14px 0 4px; font-weight:900; letter-spacing:-1px; }
  .who { font-size:20px; color: var(--muted); margin:0 0 18px; font-weight:600; }
  .score { font-size:15px; letter-spacing:2px; color: var(--muted); font-weight:700; }
  .num { font-size:64px; font-weight:900; color: var(--magenta); line-height:1; margin:6px 0 20px; }
  .btn { display:block; width:100%; padding:18px; border-radius:18px; font-size:20px; font-weight:900; text-decoration:none; margin-top:12px; }
  .play { background: var(--magenta); color:#fff; }
  .get { background:#fff; color: var(--violet); border:2px solid var(--violet); }
  .small { color: var(--muted); font-size:14px; margin-top:16px; line-height:1.4; }
  [hidden] { display:none !important; }
  h1#title { font-size:32px; }
  .beat { font-size:26px; font-weight:900; margin:0 0 8px; }
</style>
</head>
<body>
<main class="card">
  <span class="tag">FLAPPY TAPPY</span>
  <h1 id="title">You've been challenged!</h1>
  <p class="who" id="who">Your friend set a score.</p>
  <div id="scorebox" hidden>
    <div class="num" id="num">0</div>
    <div class="beat" id="beat">Can you beat them?</div>
  </div>
  <a class="btn play" id="open" href="#">Accept challenge</a>
  <a class="btn get" id="get" href="https://apps.apple.com/app/apple-store/id1203310957?pt=118564186&amp;ct=friend-challenge&amp;mt=8">Get Flappy Tappy (free)</a>
  <p class="small" id="small">30 seconds. Highest score wins.</p>
</main>
<script>
  // The challenge travels in the link itself (?d=...). The page reads only the name and score for display;
  // the game checks everything again when it opens the link.
  (function () {
    var q = new URLSearchParams(location.search);
    var d = q.get("d") || "";
    // November 21: "Beat my score" links carry only the challenge id (?x=); the game loads the rest.
    var x = /^[A-Za-z0-9]{8}$/.test(q.get("x") || "") ? q.get("x") : "";
    var code = q.get("code") || "";
    // Aggregate Apple campaign only: no invitation code or recipient is sent to Apple.
    document.getElementById("get").href = "https://apps.apple.com/app/apple-store/id1203310957?pt=118564186&ct=" + (code && !d ? "friend-invite" : "friend-challenge") + "&mt=8";
    var name = (q.get("n") || "").slice(0, 20);
    var pts = parseInt(q.get("p") || "", 10);
    // November 22: personal, in the owner's layout: "Chirag scored 24. Can you beat Chirag?"
    if (name) document.getElementById("who").textContent = code && !d ? name + " invited you to a duel!" : name + " scored";
    else document.getElementById("who").textContent = "Your friend scored";
    if (name && !(code && !d)) document.getElementById("beat").textContent = "Can you beat " + name + "?";
    if (code && !d) {
      document.getElementById("open").textContent = name ? "Join " + name + "'s duel" : "Join the duel";
      document.getElementById("small").textContent = "30-second duels, one tap. No game yet? Get it free: on Android the duel joins by itself when the game first opens.";
      var ends = parseInt(q.get("e") || "", 10);
      if (!isNaN(ends) && Date.now() / 1000 > ends) document.getElementById("who").textContent = "This invitation has ended. Ask for a new one.";
    }
    if (!isNaN(pts) && pts >= 0) { document.getElementById("num").textContent = pts; document.getElementById("scorebox").hidden = false; }
    var relay = q.get("r") || "";
    var e = parseInt(q.get("e") || "", 10);
    var ended = code && !d && !isNaN(e) && Date.now() / 1000 > e;
    var app = d ? "throughthering://challenge?d=" + encodeURIComponent(d)
                : (code ? "throughthering://duel?code=" + encodeURIComponent(code) : "throughthering://");
    var isAndroid = /Android/i.test(navigator.userAgent);
    // A live invitation made on Android ("r=fb") meets over Firebase, which the iPhone game does not speak yet.
    if (code && !d && relay === "fb" && !isAndroid && /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)) {
      document.getElementById("who").textContent = (name || "Your friend") + " is playing on Android. Duels between iPhone and Android are coming soon.";
      document.getElementById("open").hidden = true;
    }
    // November 21: the iPhone game cannot read id links (?x=) yet: say so instead of opening it for nothing.
    if (x && !isAndroid && /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)) {
      document.getElementById("who").textContent = (name || "Your friend") + " plays on Android. iPhone challenges are coming soon.";
      document.getElementById("open").hidden = true;
    }
    // Android (package com.flappytappy): an intent:// link opens the game when it is installed and Google Play when it
    // is not, in one tap.
    if (isAndroid) {
      // The Play link carries the challenge or the live invitation in its install referrer: a friend without the game
      // installs it and the challenge opens (or the duel joins) on the game's first launch. utm_* tags make friend
      // installs a separate source in Analytics.
      var ref;
      if (x) ref = "utm_source=challenge&utm_medium=friend&utm_campaign=beat_link&cx=" + x;
      else if (d) ref = "utm_source=challenge&utm_medium=friend&utm_campaign=challenge_link&ch=" + d;
      else if (code) ref = "utm_source=friend-invite&utm_medium=friend&utm_campaign=invite_link&code=" + encodeURIComponent(code)
                         + (isNaN(e) ? "" : "&e=" + e) + (name ? "&n=" + encodeURIComponent(name) : "");
      else ref = "utm_source=challenge&utm_medium=friend&utm_campaign=challenge_link";
      var play = "https://play.google.com/store/apps/details?id=com.flappytappy&referrer=" + encodeURIComponent(ref);
      var tail = "package=com.flappytappy;S.browser_fallback_url=" + encodeURIComponent(play) + ";end";
      if (x) app = "intent://challenge?x=" + x + "#Intent;scheme=flappytappy;" + tail;
      else if (d) app = "intent://challenge?d=" + encodeURIComponent(d) + "#Intent;scheme=flappytappy;" + tail;
      else if (code) {
        // The live invitation: the game joins the friend's duel straight away (the link keeps its code, end time,
        // name and relay).
        var extra = (isNaN(e) ? "" : "&e=" + e) + (name ? "&n=" + encodeURIComponent(name) : "") + (relay ? "&r=" + encodeURIComponent(relay) : "");
        app = "intent://duel?code=" + encodeURIComponent(code) + extra + "#Intent;scheme=flappytappy;" + tail;
      } else app = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;" + tail;
      // November 22 (owner): one button only. "Accept challenge" already opens the game, or Google Play when it is
      // not installed (the challenge rides along in the install referrer).
      var get = document.getElementById("get");
      get.href = play;
      get.style.display = "none";
    }
    if (ended) document.getElementById("open").hidden = true;
    document.getElementById("open").href = app;
    // November 21: a Beat my score link on Android opens the game (or Google Play) by itself, one tap fewer. Browsers
    // that refuse a jump without a tap simply stay here, with the big button.
    if (isAndroid && x) { document.getElementById("open").textContent = "Accept challenge"; setTimeout(function () { location.href = app; }, 50); }
  })();
</script>
</body>
</html>
